name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Style & Lint
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.17.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify Zig Version
        run: test "$(zig version)" = "$ZIG_VERSION"

      - name: Check Formatting
        run: zig fmt --check src/ examples/ tests/ build.zig

      - name: Verify Version Consistency
        run: |
          ZON_VER=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          echo "build.zig.zon version: $ZON_VER"
          if [ -z "$ZON_VER" ]; then
            echo "Error: Version not found in build.zig.zon"
            exit 1
          fi

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    env:
      ZIG_VERSION: 0.17.0-dev.2085+5e36170b5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Verify Zig Version
        run: test "$(zig version)" = "$ZIG_VERSION"

      - name: Run Unit Tests
        run: zig build test

      - name: Run Examples
        run: zig build run-example

      - name: Run Benchmarks
        run: zig build bench
